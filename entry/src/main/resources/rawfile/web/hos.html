      // 诊断预脚本：任何 JS 错误以红底浮层直接显示在页面内（不依赖 nativeBridge）
      ;(function () {
        function show(m) {
          try {
            var d = document.getElementById('scilab-errbox')
            if (!d) {
              d = document.createElement('pre')
              d.id = 'scilab-errbox'
              d.style.cssText =
                'position:fixed;top:0;left:0;right:0;z-index:99999;background:#5a1a1a;color:#ffd9d9;' +
                'font:11px/1.4 Consolas,monospace;padding:8px;white-space:pre-wrap;max-height:45%;overflow:auto;margin:0'
              document.body.appendChild(d)
            }
            d.textContent += m + '\n'
            // 超过 8 行自动只保留最新（防刷屏）
            var lines = d.textContent.split('\n').filter(Boolean)
            if (lines.length > 8) d.textContent = lines.slice(-8).join('\n') + '\n'
          } catch (_) {}
        }
        ;(window).__scilabShow = show
        // 点击浮层可暂时隐藏
        document.addEventListener('click', function () {
          var d = document.getElementById('scilab-errbox')
          if (d) d.style.display = 'none'
        })
        window.addEventListener('error', function (e) {
          show('[error] ' + (e.message || e.error) + (e.filename ? ' @' + (e.filename.split('/').pop()) + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show('[promise] ' + String((r && r.stack) || r))
        })
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var app = document.getElementById('app')
            if (!app || app.childElementCount === 0) {
              show('[watchdog] Vue 未挂载：#app 为空。若上方无 JS 错误，说明脚本未执行或 WebView 环境受限。')
            }
          }, 4000)
        })
      })()

stry.combustion",title:"燃烧条件探究",camera:{position:[3.5,3,4.5],target:[0,1.8,0]},objects:[],params:[{id:"fuel",label:"可燃物（木条）",min:0,max:1,step:1,value:1},{id:"oxygen",label:"氧气充足",min:0,max:1,step:1,value:1},{id:"heat",label:"达到着火点",min:0,max:1,step:1,value:1}],records:[],guide:"燃烧需要同时满足三个条件：①可燃物 ②与氧气（助燃物）接触 ③温度达到着火点。逐一关闭任一开关，火焰立即熄灭。灭火的原理就是破坏三要素中的任意一个：清除可燃物、隔绝氧气、降温至着火点以下。"},IS={id:"chemistry.gas_prepare",title:"氧气制备与检验",camera:{position:[3.5,3,4.5],target:[0,1.8,0]},objects:[],params:[{id:"heat",label:"酒精灯加热",min:0,max:1,step:1,value:1},{id:"kmno4",label:"高锰酸钾质量 (g)",min:3,max:15,step:1,value:8}],records:[{id:"t",label:"t (s)",digits:1},{id:"v",label:"V(O₂) (mL)",digits:2,sigma:.4}],curve:{x:"t",y:"v",title:"集气体积 - 时间曲线"},guide:"实验室加热高锰酸钾制取氧气（排水集气法）：检查装置气密性后，用酒精灯加热试管中的高锰酸钾，氧气经导管进入倒扣在水槽中的集气瓶，排水集气。收集满后用玻璃片盖住瓶口取出。检验：将带火星的木条伸入集气瓶，木条复燃，证明瓶内是氧气。注意：试管口应略向下倾斜，防止冷凝水回流使试管炸裂；实验结束先撤导管后熄灯。点击「开始」加热并记录 V-t 数据，观察产气速率与药品质量的关系。"},NS={id:"chemistry.metal_activity",title:"金属活动性顺序",camera:{position:[3.2,2.8,4.5],target:[0,1.2,0]},objects:[],params:[{id:"metal",label:"金属（0=Mg / 1=Zn / 2=Cu）",min:0,max:2,step:1,value:1},{id:"conc",label:"盐酸浓度",min:.5,max:2,step:.1,value:1,unit:"×"}],records:[],guide:"把金属放入稀盐酸，观察气泡（H₂）产生的剧烈程度：Mg 剧烈、Zn 缓慢、Cu 无反应。金属活动性顺序 K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag——排在氢前面的金属能与稀酸反应放出氢气，越靠前越剧烈。"},DS={id:"chemistry.precipitate",title:"沉淀反应与颜色变化",camera:{position:[3.2,2.8,4.5],target:[0,1.2,0]},objects:[],params:[{id:"reagent",label:"反应组（0=AgNO₃+NaCl / 1=CuSO₄+NaOH）",min:0,max:1,step:1,value:0},{id:"volume",label:"滴加试剂体积",min:0,max:20,step:1,value:10,unit:"mL"}],records:[],guide:"复分解反应发生条件之一：生成沉淀。AgNO₃ 与 NaCl 反应生成白色的 AgCl 沉淀（检验 Cl⁻ 的特征反应）；CuSO₄ 与 NaOH 反应生成蓝色的 Cu(OH)₂ 絮状沉淀。观察沉淀量随滴加体积的变化。"},FS={id:"college.enzyme",title:"酶动力学（米氏方程）",camera:{position:[0,1.5,6],target:[0,.5,0]},objects:[],params:[{id:"Km",label:"米氏常数 Km",min:.5,max:5,step:.1,value:2,unit:"mmol/L"},{id:"Vmax",label:"最大速率 Vmax",min:.5,max:2,step:.1,value:1,unit:"μmol/(L·min)"}],records:[{id:"S",label:"[S] (mmol/L)",digits:1},{id:"v",label:"v",digits:3}],curve:{x:"S",y:"v",title:"米氏曲线 v – [S]（低浓度近似一级、高浓度零级饱和）"},guide:"紫色为酶、橙色为底物。米氏方程 v = Vmax·[S]/(Km+[S])：低底物浓度时 v ∝ [S]（一级反应），高浓度时酶被饱和 v → Vmax（零级反应）。Km 表示速率达 Vmax 一半时的底物浓度，反映酶与底物的亲和力（Km 越小亲和越强）。双倒数作图（Lineweaver–Burk）可将双曲线化为直线求参数。"},US={id:"college.genetics",title:"孟德尔遗传杂交模拟",camera:{position:[0,1.5,6],target:[0,.6,0]},objects:[],params:[{id:"cross",label:"杂交组合（0:Aa×Aa / 1:AA×aa / 2:Aa×aa）",min:0,max:2,step:1,value:0}],records:[],guide:"豌豆子叶颜色：黄(Y)对绿(y)显性。Aa×Aa 自交 → F2 表型 3 黄:1 绿（基因型 1:2:1，分离定律）；AA×aa → F1 全黄(Aa)；Aa×aa 测交 → 1:1，验证配子纯度。大样本统计结果符合概率比——这正是孟德尔 1865 年的统计思想。"},OS={id:"college.rlc",title:"RLC 串联电路谐振",camera:{position:[0,1.5,6],target:[0,0,0]},objects:[],params:[{id:"L",label:"电感 L",min:.1,max:10,step:.1,value:1,unit:"mH"},{id:"C",label:"电容 C",min:.1,max:10,step:.1,value:1,unit:"µF"},{id:"R",label:"电阻 R",min:1,max:50,step:1,value:10,unit:"Ω"}],records:[{id:"f",label:"f (Hz)",digits:0},{id:"I",label:"I (A)",digits:3}],curve:{x:"f",y:"I",title:"幅频特性 I – f（谐振峰在 f₀ = 1/(2π√LC)）"},guide:"RLC 串联电路（U = 5V）：阻抗 Z = √(R² + (ωL − 1/ωC)²)，当 ωL = 1/ωC 时电路谐振，电流最大 I₀ = U/R。品质因数 Q = (1/R)√(L/C) 决定曲线尖锐程度。改变 L、C 可移动谐振频率，改变 R 可调节带宽。"},BS={id:"college.titration",title:"酸碱滴定分析（乙酸 pKa 测定）",camera:{position:[3.2,2.8,4.5],target:[0,1.2,0]},objects:[],params:[{id:"naoh",label:"滴加 NaOH (0.1mol/L)",min:0,max:50,step:.5,value:0,unit:"mL"}],records:[{id:"V",label:"V (mL)",digits:1},{id:"pH",label:"pH",digits:2}],curve:{x:"V",y:"pH",title:"滴定曲线：注意缓冲区平坦段与半中和点 pH = pKa"},guide:"25 mL 0.1 mol/L 乙酸（弱酸，Ka = 1.75×10⁻⁵）用 0.1 mol/L NaOH 滴定。缓冲区 pH = pKa + log([Ac⁻]/[HAc])；半中和点（V = 12.5 mL）pH = pKa，由此可测弱酸解离常数。对比强酸滴定：起点 pH 更高、计量点 pH > 7。"},zS={id:"college.uncertainty",title:"测量不确定度评定",camera:{position:[0,1,6],target:[0,0,0]},objects:[],params:[{id:"n",label:"测量次数 n",min:5,max:20,step:1,value:10},{id:"tol",label:"仪器允差 Δ仪",min:.005,max:.05,step:.005,value:.02,unit:"mm"}],records:[{id:"x",label:"测量值 (mm)",digits:3},{id:"d",label:"残差 (mm)",digits:3}],curve:{x:"x",y:"d",title:"残差分布（评估随机误差）"},guide:"对同一量（约 10.000 mm）等精度重复测量。每次点击「开始」重新采样：x̄ 为算术平均，s 为实验标准差；A 类不确定度 uA = s/√n（随机误差），B 类 uB = Δ仪/√3（仪器误差），合成 uc = √(uA²+uB²)，扩展不确定度 U = 2uc（95% 置信，k=2）。"},kS={id:"physics.buoyancy",title:"浮力与物体浮沉",physics:{gravity:9.8},camera:{position:[4,3.5,6],target:[0,1.2,0]},objects:[{id:"cube",type:"box",size:[.7,.7,.7],position:[0,2.6,0],mass:.2,color:"#c8a060",friction:.1,restitution:.05}],params:[{id:"density",label:"物块密度",min:200,max:1200,step:50,value:600,unit:"kg/m³"}],records:[{id:"t",label:"t (s)",digits:2},{id:"h",label:"吃水深度 (m)",digits:3}],curve:{x:"t",y:"h",title:"吃水深度 – 时间（振动后趋于平衡）"},guide:"阿基米德原理：F浮 = ρ水·g·V排。物块落入水箱后上下振动最终平衡：ρ物 < ρ水 漂浮（V排/V物 = ρ物/ρ水，如 600/1000 = 0.6，即 60% 体积浸入）；ρ物 > ρ水 下沉（如铁块）；ρ物 = ρ水 悬浮。轮船正是用空心结构降低平均密度实现漂浮。"},VS={id:"physics.circuit_basic",title:"基础电路搭建",camera:{position:[0,1,6.5],target:[0,1,0]},objects:[],params:[{id:"switch",label:"开关闭合",min:0,max:1,step:1,value:1},{id:"voltage",label:"电源电压",min:0,max:12,step:.5,value:6,unit:"V"},{id:"resistance",label:"滑动变阻器",min:5,max:50,step:1,value:20,unit:"Ω"}],records:[{id:"U",label:"U (V)",digits:1},{id:"I",label:"I (A)",digits:3},{id:"P",label:"P (W)",digits:3}],guide:"简单串联电路：电池 — 开关 — 滑动变阻器 — 灯泡（内阻 10Ω）。闭合开关点亮灯泡；调节电压或电阻，观察灯泡亮度（功率）与电流变化。断开开关后电路无电流。电路由 MNA 节点分析法实时求解。"},HS={id:"physics.collision",title:"动量守恒碰撞",physics:{gravity:0},camera:{position:[0,3,10],target:[0,.5,0]},ground:{size:24},objects:[{id:"ball1",type:"sphere",size:[.4],position:[-3,.42,0],mass:1,color:"#d05a5a",friction:0,restitution:1},{id:"ball2",type:"sphere",size:[.4],position:[3,.42,0],mass:2,color:"#4a7dc0",friction:0,restitution:1}],params:[{id:"m1",label:"质量 m₁",min:.5,max:5,step:.5,value:1,unit:"kg"},{id:"m2",label:"质量 m₂",min:.5,max:5,step:.5,value:2,unit:"kg"},{id:"v1",label:"初速 v₁",min:1,max:6,step:.5,value:3,unit:"m/s"},{id:"v2",label:"初速 v₂（相向）",min:0,max:4,step:.5,value:1,unit:"m/s"},{id:"e",label:"恢复系数 e（1 弹性 / 0 完全非弹性）",min:0,max:1,step:.1,value:1}],records:[{id:"t",label:"t (s)",digits:2},{id:"p",label:"总动量 (kg·m/s)",digits:3},{id:"Ek",label:"总动能 (J)",digits:3}],curve:{x:"t",y:"p",title:"总动量 – 时间（任何碰撞下均为水平线）"},guide:"两球在光滑导轨上相向运动。碰撞过程中系统内力远大于外力，总动量始终守恒（曲线为水平线）；恢复系数 e = 1 时动能也守恒（弹性碰撞），e < 1 时部分动能转化为内能（非弹性碰撞）。改变质量比与恢复系数，观察碰后速度分配。",exam:{timeLimitSec:420,goals:[{minRecords:10,weight:40}],checklist:["质量","恢复系数","开始实验"]}},GS={id:"physics.energy",title:"机械能守恒（竖直上抛）",physics:{gravity:9.8},camera:{position:[6,8,10],target:[0,5,0]},ground:{size:16},objects:[{id:"ball",type:"sphere",size:[.3],position:[0,.3,0],mass:1,color:"#d08a3e",friction:.2,restitution:0}],params:[{id:"v0",label:"初速度 v₀",min:5,max:17,step:.5,value:12,unit:"m/s"}],records:[{id:"t",label:"t (s)",digits:2},{id:"h",label:"h (m)",digits:2},{id:"Ek",label:"动能 (J)",digits:2},{id:"Ep",label:"势能 (J)",digits:2},{id:"E",label:"机械能 E",digits:2}],curve:{x:"t",y:"E",title:"机械能总量 – 时间（守恒则为水平线）"},guide:"小球以初速 v₀ 竖直上抛（忽略空气阻力）。上升阶段动能转化为重力势能，最高点动能最小、势能最大；下落过程相反。整个过程中 Ek + Ep = 恒量（机械能守恒定律），曲线图中 E 为水平线。最大高度 h = v₀²/2g。"},$S={id:"physics.free_fall",title:"自由落体运动测定",physics:{gravity:9.8},camera:{position:[14,9,16],target:[0,5,0]},ground:{size:20},objects:[{id:"ball",type:"sphere",size:[.3],position:[0,10,0],mass:1,color:"#d08a3e",friction:.1,restitution:0}],params:[{id:"height",label:"下落高度",min:1,max:20,step:.5,value:10,unit:"m"},{id:"gravity",label:"重力加速度",min:1.6,max:24.8,step:.1,value:9.8,unit:"m/s²"}],records:[{id:"t",label:"t (s)",digits:2,sigma:.2},{id:"y",label:"y (m)",digits:3},{id:"v",label:"v (m/s)",digits:3}],curve:{x:"t",y:"v",title:"v – t 图（斜率 = g）"},guide:"设置下落高度与重力加速度（1.6=月球，9.8=地球，24.8=木星），点击「开始」释放小球。落地后由 h = ½gt² 反推重力加速度，与设定值对比。",instruments:[{id:"sw",type:"stopwatch",label:"机械秒表",unit:"s",digits:2,recordColumn:"t"}],exam:{timeLimitSec:480,goals:[{metric:"g",expectFromParam:"gravity",tolerance:.6,weight:60},{minRecords:3,weight:20}],checklist:["下落高度","开始实验","仪器读数"]}},WS={id:"physics.gas_law",title:"气体定律（活塞气缸）",camera:{position:[3.5,2.5,6],target:[0,1.7,0]},objects:[],params:[{id:"T",label:"温度 T",min:200,max:600,step:10,value:300,unit:"K"},{id:"weights",label:"砝码个数（决定压强）",min:1,max:5,step:1,value:2}],records:[{id:"V",label:"V (任意单位)",digits:2},{id:"P",label:"P (任意单位)",digits:2}],curve:{x:"V",y:"P",title:"P – V 图（同一温度下为反比双曲线）"},guide:"活塞气缸内封闭一定质量理想气体。加砝码增大压强、升温使分子运动加快（橙色粒子）。改变参数后点击「开始」记录一组 (P, V)：等温时 P·V = 恒量（玻意耳定律），等压时 V ∝ T（查理定律）。多个数据点连成 P–V 双曲线。"},qS={id:"physics.inclined_plane",title:"斜面上物体运动探究",physics:{gravity:9.8},camera:{position:[8,5,10],target:[0,1.5,0]},ground:{size:24},objects:[{id:"ramp",type:"box",size:[8,.3,3],position:[0,1.5,0],static:!0,color:"#5a7a9a",friction:.316},{id:"block",type:"box",size:[.7,.7,.7],position:[3,3,0],mass:1,color:"#3f8f79",friction:.316,restitution:.02}],params:[{id:"angle",label:"倾角",min:5,max:45,step:1,value:25,unit:"°"},{id:"mass",label:"滑块质量",min:.5,max:5,step:.1,value:1,unit:"kg"},{id:"friction",label:"摩擦系数",min:0,max:.8,step:.05,value:.1}],records:[{id:"t",label:"t (s)",digits:2},{id:"s",label:"s (m)",digits:3,sigma:.005},{id:"v",label:"v (m/s)",digits:3}],curve:{x:"t",y:"v",title:"v – t 图（斜率 = 加速度）"},guide:"调节倾角、质量与摩擦系数，点击「开始」释放滑块。观察 v–t 图：直线斜率即加速度。理论值 a = g·(sinθ − μ·cosθ)。当 μ ≥ tanθ 时滑块保持静止。",instruments:[{id:"ruler",type:"ruler",label:"刻度尺",unit:"m",digits:3,recordColumn:"s"}],exam:{timeLimitSec:600,goals:[{minRecords:20,weight:50}],checklist:["倾角","摩擦系数","开始实验","仪器读数"]}},XS={id:"physics.lens",title:"凸透镜成像规律",camera:{position:[0,.5,9],target:[0,.5,0]},objects:[],params:[{id:"u",label:"物距 u",min:10,max:60,step:1,value:30,unit:"cm"},{id:"f",label:"焦距 f",min:5,max:20,step:1,value:10,unit:"cm"}],records:[{id:"u",label:"u (cm)",digits:0},{id:"v",label:"v (cm)",digits:1}],curve:{x:"u",y:"v",title:"v – u 图（u = 2f 处 v = u）"},guide:"红色箭头为物，绿色箭头为像（虚像半透明）。三条特殊光线：①平行主轴折射过焦点；②过光心不偏折；③过焦点折射后平行主轴（虚像时虚线为反向延长线）。u > 2f 缩小实像、u = 2f 等大、f < u < 2f 放大实像、u = f 不成像、u < f 放大虚像（放大镜原理）。成像公式 1/f = 1/u + 1/v。"},YS={id:"physics.ohm_law",title:"欧姆定律验证",camera:{position:[0,1,6.5],target:[0,1,0]},objects:[],params:[{id:"voltage",label:"电源
