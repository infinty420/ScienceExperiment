<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SciLab 3D Engine</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2430;
      touch-action: none;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      color: #9fb3c8;
      font: 11px monospace;
      user-select: none;
      pointer-events: none;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">SciLab Engine W1</div>
  <script src="lib/three.min.js"></script>
  <script src="engine/core.js"></script>
  <script src="engine/main.js"></script>
</body>
</html>
