<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>智实验 SciLab</title>
    <script>
      // 诊断预脚本：任何 JS 错误以红底浮层直接显示在页面内（不依赖 nativeBridge）
      ;(function () {
        function show(m) {
          try {
            var d = document.getElementById('scilab-errbox')
            if (!d) {
              d = document.createElement('pre')
              d.id = 'scilab-errbox'
              d.style.cssText =
                'position:fixed;top:0;left:0;right:0;z-index:99999;background:#5a1a1a;color:#ffd9d9;' +
                'font:11px/1.4 Consolas,monospace;padding:8px;white-space:pre-wrap;max-height:45%;overflow:auto;margin:0'
              document.body.appendChild(d)
            }
            d.textContent += m + '\n'
          } catch (_) {}
        }
        window.addEventListener('error', function (e) {
          show('[error] ' + (e.message || e.error) + (e.filename ? ' @' + (e.filename.split('/').pop()) + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show('[promise] ' + String((r && r.stack) || r))
        })
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var app = document.getElementById('app')
            if (!app || app.childElementCount === 0) {
              show('[watchdog] Vue 未挂载：#app 为空。若上方无 JS 错误，说明脚本未执行或 WebView 环境受限（如 DevEco 预览器不支持 Web 组件 JS）。')
            }
          }, 4000)
          // WebGL 能力探针：支持性 + 渲染器名 + 回读测试
          setTimeout(function () {
            try {
              var lines = []
              var c2 = document.createElement('canvas')
              var gl2 = c2.getContext('webgl2')
              var c1 = document.createElement('canvas')
              var gl1 = gl2 ? null : c1.getContext('webgl')
              var gl = gl2 || gl1
              lines.push('webgl2:' + (gl2 ? 'YES' : 'NO') + ' webgl1:' + (gl1 ? 'YES' : 'NO'))
              if (gl) {
                var dbg = gl.getExtension('WEBGL_debug_renderer_info')
                lines.push('gpu:' + String(dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)).slice(0, 60))
                gl.clearColor(1, 0, 0, 1)
                gl.clear(gl.COLOR_BUFFER_BIT)
                var px = new Uint8Array(4)
                gl.readPixels(1, 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px)
                lines.push('readback:' + px.join(','))
              }
              var app2 = document.getElementById('app')
              var cv = app2 ? app2.querySelector('canvas') : null
              if (cv) {
                lines.push('appCanvas:' + cv.clientWidth + 'x' + cv.clientHeight + ' buf:' + cv.width + 'x' + cv.height)
                var agl = cv.getContext('webgl2') || cv.getContext('webgl')
                if (agl) {
                  var apx = new Uint8Array(4)
                  agl.readPixels(Math.floor(agl.drawingBufferWidth / 2), Math.floor(agl.drawingBufferHeight / 2), 1, 1, agl.RGBA, agl.UNSIGNED_BYTE, apx)
                  lines.push('centerRGBA:' + apx.join(','))
                }
              } else {
                lines.push('appCanvas: 未找到')
              }
              show('[glprobe] ' + lines.join(' | '))
            } catch (err) {
              show('[glprobe error] ' + String(err))
            }
          }, 5000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/hos/main.ts"></script>
  </body>
</html>
