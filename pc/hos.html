<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>智实验 SciLab</title>
    <script>
      // r5 定案：离屏 canvas 在 ArkWeb 上 WebGL 读回全黑（r3/r4 设备证据，preserve 也救不了），
      // 2D 合成路线废弃，回直连 GL canvas + preserve:true（38a5a33 已验证设备有画面）。
      // 闪屏治理移至 ArkTS 侧：Web 组件 renderMode(SYNC) 同步渲染。
      // 1× 渲染分辨率（CSS 尺寸不变，缓冲降 3.6 倍像素量）
      ;(function () { window.__SCILAB_RENDER_SCALE = 1; window.__SCILAB_COMPOSITE_2D = false })()
      // 诊断预脚本：任何 JS 错误以红底浮层直接显示在页面内（不依赖 nativeBridge）
      ;(function () {
        function show(m) {
          try {
            var d = document.getElementById('scilab-errbox')
            if (!d) {
              d = document.createElement('pre')
              d.id = 'scilab-errbox'
              d.style.cssText =
                'position:fixed;top:0;left:0;right:0;z-index:99999;background:#5a1a1a;color:#ffd9d9;' +
                'font:11px/1.4 Consolas,monospace;padding:8px;white-space:pre-wrap;max-height:45%;overflow:auto;margin:0'
              document.body.appendChild(d)
            }
            d.textContent += m + '\n'
            // 超过 8 行自动只保留最新（防刷屏）
            var lines = d.textContent.split('\n').filter(Boolean)
            if (lines.length > 8) d.textContent = lines.slice(-8).join('\n') + '\n'
          } catch (_) {}
        }
        ;(window).__scilabShow = show
        // 点击浮层可暂时隐藏
        document.addEventListener('click', function () {
          var d = document.getElementById('scilab-errbox')
          if (d) d.style.display = 'none'
        })
        window.addEventListener('error', function (e) {
          show('[error] ' + (e.message || e.error) + (e.filename ? ' @' + (e.filename.split('/').pop()) + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show('[promise] ' + String((r && r.stack) || r))
        })
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var app = document.getElementById('app')
            if (!app || app.childElementCount === 0) {
              show('[watchdog] Vue 未挂载：#app 为空。若上方无 JS 错误，说明脚本未执行或 WebView 环境受限。')
            }
          }, 4000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/hos/main.ts"></script>
  </body>
</html>
